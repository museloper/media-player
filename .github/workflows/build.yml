name: Build and Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # The release always publishes to the same "latest" tag, so the
      # version number must go up on every build or electron-updater
      # (Windows side) can never tell a new build apart from the old one.
      - run: npm pkg set version=1.0.${{ github.run_number }}
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: dist/*.dmg

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm pkg set version=1.0.${{ github.run_number }}
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: win-exe
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml

  release:
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          files: |
            artifacts/mac-dmg/*.dmg
            artifacts/win-exe/*.exe
            artifacts/win-exe/*.exe.blockmap
            artifacts/win-exe/latest.yml
