<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Media Player</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <div class="player-pane">
      <video id="media" controls></video>
      <div class="now-playing-row">
        <div class="now-playing" id="nowPlaying">재생할 항목을 선택하세요</div>
        <div class="options-wrap">
          <button id="optionsBtn" class="options-btn">⚙ 옵션</button>
          <div id="optionsMenu" class="menu hidden">
            <button class="menu-item has-submenu" id="speedMenuBtn">속도조절 ▸</button>
            <div id="speedSubmenu" class="submenu hidden">
              <button class="menu-item" data-rate="0.5">0.5x</button>
              <button class="menu-item" data-rate="0.75">0.75x</button>
              <button class="menu-item" data-rate="1">1x (기본)</button>
              <button class="menu-item" data-rate="1.25">1.25x</button>
              <button class="menu-item" data-rate="1.5">1.5x</button>
              <button class="menu-item" data-rate="2">2x</button>
              <button class="menu-item" id="customSpeedBtn">커스텀...</button>
            </div>
          </div>
        </div>
      </div>
      <div class="transport">
        <button id="prevBtn">⏮ 이전</button>
        <button id="playBtn">▶ 재생</button>
        <button id="nextBtn">다음 ⏭</button>
      </div>
    </div>

    <div id="speedModal" class="modal-overlay hidden">
      <div class="modal-box">
        <h3>재생 속도 커스텀 설정</h3>
        <input type="number" id="customSpeedInput" min="0.1" max="4" step="0.05" value="1">
        <div class="modal-actions">
          <button id="speedCancelBtn">취소</button>
          <button id="speedConfirmBtn">확인</button>
        </div>
      </div>
    </div>
    <div class="playlist-pane">
      <div class="playlist-header">
        <span>재생목록</span>
        <div>
          <button id="addBtn">+ 파일 추가</button>
          <button id="clearBtn">전체 삭제</button>
        </div>
      </div>
      <ul id="playlist"></ul>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
